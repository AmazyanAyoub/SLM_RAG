services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: slm_rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__API_KEY=my_secret_api_key_2025
      - QDRANT__SERVICE__HOST=0.0.0.0
    volumes:
      - qdrant_data:/qdrant/storage  # <--- Using the named volume
    restart: always

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: always
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

# --- YOU MUST ADD qdrant_data HERE ---
volumes:
  ollama_storage:
  qdrant_data:      # <--- ADD THIS LINE (empty dict is fine)